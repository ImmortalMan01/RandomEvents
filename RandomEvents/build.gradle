plugins {
    id 'java'
}

archivesBaseName = 'RandomEvents'
version = '2.9.5'

dependencies {
    // Match the API version declared in plugin.yml
    compileOnly 'org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'com.zaxxer:HikariCP:4.0.3'
    compileOnly 'com.github.koca2000:NoteBlockAPI:1.5.0'
    compileOnly 'com.github.PlaceholderAPI:PlaceholderAPI:2.11.3'
    compileOnly 'net.citizensnpcs:citizens-main:2.0.33-SNAPSHOT'
    compileOnly 'commons-lang:commons-lang:2.6'
    compileOnly 'com.github.booksaw:BetterTeams:4.13.2'
    compileOnly project(':stubs')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT'
}

sourceSets {
    main {
        java.srcDir 'src'
        java.exclude 'com/immortalman01/randomevents/util/UtilsProtocolLib.java'
        java.exclude 'test/**'
        resources.srcDir '.'
        resources.includes = ['plugin.yml','config.yml','defaultConfig.yml','messages.yml','messages_tr.yml','Luzverde2.nbs','luzverde.nbs','scoreboard.yml','scoreboard_tr.yml']
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('.') {
        include 'plugin.yml','config.yml','defaultConfig.yml','messages.yml','messages_tr.yml','Luzverde2.nbs','luzverde.nbs','scoreboard.yml','scoreboard_tr.yml'
    }
}

test {
    useJUnitPlatform()
}
